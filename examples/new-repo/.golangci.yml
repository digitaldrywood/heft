# heft default configuration. Generated by `heft init`; edit freely.
# Rules and the reasoning behind each limit:
# https://github.com/digitaldrywood/heft/blob/main/docs/rules.md
version: "2"
linters:
  enable:
    - heft
  settings:
    custom:
      heft:
        type: module
        description: Keeps Go packages small so tests stay fast and cache well.
        original-url: github.com/digitaldrywood/heft
        settings:
          # Per-package limits. 0 turns a check off.
          limits:
            files: 40
            loc: 10000
            test-files: 40
            test-funcs: 200
            exports: 0
            imports: 0
          # Files to ignore, matched against absolute paths. Files marked
          # "Code generated ... DO NOT EDIT." are always skipped.
          exclude:
            - "**/*_templ.go"
            - "**/mocks/**"
            - "**/*.pb.go"
          # Packages to skip entirely, matched against import paths.
          # Packages whose own tests are excluded too (foo and foo_test).
          exclude-packages: []
          # - "example.com/app/templates/**"
          # Raise limits for specific packages, matched against import paths.
          # Later entries win, key by key.
          overrides: []
          # - packages: ["example.com/app/internal/legacy/**"]
          #   limits: {files: 120}
          banned-names: [util, utils, common, helper, helpers, models, misc]
          # Committed sizes of packages that are already too big.
          # Create with `heft baseline write`, shrink with `heft baseline tighten`.
          baseline: .heft-baseline.json
